name: Test preloaded Windows setup
on:
  push:
    branches: [main]
    paths:
      - 'packaging/Preparar-SASISOPA.ps1'
      - 'packaging/INSTALAR-TODO.bat'
      - 'packaging/probar-base-incluida.ps1'
      - 'scripts/fixture_base_incluida.py'
      - '.github/workflows/included-base.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install PyMuPDF==1.26.6
      - name: Create public synthetic package and verify installer
        shell: pwsh
        run: |
          $package = Join-Path $env:RUNNER_TEMP 'paquete con espacios'
          New-Item -ItemType Directory -Path $package -Force | Out-Null
          $base = 'https://github.com/misaelsainz9-glitch/COG/releases/download/v0.2.2'
          Invoke-WebRequest "$base/SASISOPA-Instalador-Windows.exe" -OutFile "$package/SASISOPA-Instalador-Windows.exe"
          Invoke-WebRequest "$base/SHA256SUMS.txt" -OutFile "$package/SHA256SUMS.txt"
          $expected = ((Get-Content "$package/SHA256SUMS.txt" -Raw).Trim() -split '\s+')[0]
          if ((Get-FileHash "$package/SASISOPA-Instalador-Windows.exe" -Algorithm SHA256).Hash.ToLower() -ne $expected) { throw 'Installer hash mismatch' }
          python scripts/fixture_base_incluida.py "$package"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Check automatic installation and preloaded base
        shell: pwsh
        run: |
          & packaging/probar-base-incluida.ps1 -Package (Join-Path $env:RUNNER_TEMP 'paquete con espacios')
