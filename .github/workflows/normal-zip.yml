name: Test normal ZIP for Windows
on:
  push:
    branches: [main]
    paths:
      - 'scripts/empaquetar_zip_windows.py'
      - 'packaging/Preparar-paquete.ps1'
      - 'packaging/INSTALAR-PAQUETE-NORMAL.bat'
      - 'packaging/probar-zip-normal.ps1'
      - '.github/workflows/normal-zip.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install PyMuPDF==1.26.6
      - name: Make ordinary ZIP with public synthetic documents only
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'fixture ZIP normal'
          $inner = Join-Path $root 'contenido\SASISOPA'
          $extra = Join-Path $root '7zip oficial'
          New-Item -ItemType Directory -Path $inner,$extra -Force | Out-Null
          Invoke-WebRequest 'https://github.com/ip7z/7zip/releases/download/25.01/7z2501-extra.7z' -OutFile "$root/extra.7z"
          & 7z x "$root/extra.7z" "-o$extra" -y
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $base = 'https://github.com/misaelsainz9-glitch/COG/releases/download/v0.2.2'
          Invoke-WebRequest "$base/SASISOPA-Instalador-Windows.exe" -OutFile "$inner/SASISOPA-Instalador-Windows.exe"
          Invoke-WebRequest "$base/SHA256SUMS.txt" -OutFile "$root/SHA256SUMS.txt"
          $expected = ((Get-Content "$root/SHA256SUMS.txt" -Raw).Trim() -split '\s+')[0]
          if ((Get-FileHash "$inner/SASISOPA-Instalador-Windows.exe" -Algorithm SHA256).Hash.ToLower() -ne $expected) { throw 'Installer hash mismatch' }
          python scripts/fixture_base_incluida.py "$inner"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $extractor = Join-Path $extra 'x64\7za.exe'
          Push-Location (Join-Path $root 'contenido')
          try {
            & $extractor a -tzip "$root/protegido.zip" SASISOPA '-pPRUEBA-PUBLICA-SIN-DATOS-REALES' '-mem=AES256' '-mx=1'
            if ($LASTEXITCODE -ne 0) { throw 'Synthetic payload creation failed' }
          } finally { Pop-Location }
          python scripts/empaquetar_zip_windows.py --payload "$root/protegido.zip" --extractor "$extractor" --license-file "$extra/License.txt" --output "$root/normal.zip"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Extract with Windows and prepare program without installing 7-Zip
        shell: pwsh
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File packaging/probar-zip-normal.ps1 -Zip (Join-Path $env:RUNNER_TEMP 'fixture ZIP normal\normal.zip')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
