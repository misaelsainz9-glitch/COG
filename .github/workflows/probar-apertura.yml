name: Verify document package opener on Windows
on:
  push:
    branches: ['verificar-apertura-documentos-*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install PyMuPDF==1.26.6 pyzipper==0.3.6
      - name: Test Windows extraction and native PowerShell 5 opener
        shell: pwsh
        run: ./probar.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: resultado-apertura-windows
          path: resultado-windows.json
