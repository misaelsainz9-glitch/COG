name: Windows verification
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install application dependencies
        run: python -m pip install -r requirements.txt
      - name: Model and catalogue tests
        run: python -m unittest discover -s tests -v
      - name: Real Tk window and synthetic PDF on Windows
        run: python -m unittest discover -s tests -p test_desktop_smoke.py -v
