name: Windows verification
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run Windows installer
        shell: cmd
        run: Instalar.bat < nul
      - name: Model, catalogue and real desktop tests
        run: .venv\Scripts\python.exe scripts/verify_desktop.py
